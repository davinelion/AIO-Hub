name: Monthly AIO digest

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-publish-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out index
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and write the monthly draft
        run: node scripts/monthly-digest.mjs
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      - name: Commit updated catalog and article
        run: |
          git config user.name 'AIO Hub automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/
          git diff --cached --quiet || git commit -m "chore: update monthly app digest"
          git push
